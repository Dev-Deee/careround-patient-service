spring.application.name=careround-patient-service
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/careround_patient_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.public-key=${JWT_PUBLIC_KEY}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=patient-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

grpc.server.port=9090
# gRPC client: ward existence check on patient admission
grpc.client.ward-service.address=static://localhost:9093
grpc.client.ward-service.negotiationType=plaintext
app.grpc.deadline-ms=5000
